name: Code Quality Checks

permissions:
  contents: read

on:
  # Run on every commit to main
  push:
    branches:
      - main

  # Run on every pull request
  pull_request:
    types: [opened, synchronize, reopened]

  # Run on every manual workflow dispatch
  workflow_dispatch:

# Cancel in-progress jobs when a new push is made to the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  main-checks:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10

      - name: Cache Bun downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: lumi-checks-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            lumi-checks-${{ runner.os }}-

      - name: Install Dependencies
        run: bun install --development --ignore-scripts

      - name: Run Type Check
        run: bun run typecheck

      - name: Run Lint
        run: bun run lint

  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10

      - name: Cache Bun downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: lumi-checks-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            lumi-checks-${{ runner.os }}-

      - name: Install Dependencies
        run: bun install --development --ignore-scripts

      - name: Format Code
        run: bun run format

      - name: Verify code is formatted
        run: git diff --exit-code -- ':!bun.lock'
