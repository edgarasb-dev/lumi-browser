name: Code Quality Checks

permissions:
  contents: read

on:
  # Run on every commit to main
  push:
    branches:
      - main

  # Run on every pull request
  pull_request:
    types: [opened, synchronize, reopened]

  # Run on every manual workflow dispatch
  workflow_dispatch:

# Cancel in-progress jobs when a new push is made to the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use preinstalled Node.js 22+
        id: node
        run: |
          NODE_BIN=$(ls -d "$RUNNER_TOOL_CACHE"/node/22.*/x64/bin 2>/dev/null | sort -V | tail -n1 || true)
          if [ -n "$NODE_BIN" ] && [ -x "$NODE_BIN/node" ]; then
            echo "$NODE_BIN" >> "$GITHUB_PATH"
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Node.js (Fallback)
        if: steps.node.outputs.found != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10

      - name: Cache ESLint, Prettier & TypeScript incrementals
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .eslintcache
            .prettiercache
            .tsbuildinfo.*
          key: lumi-checks-meta-${{ runner.os }}-${{ hashFiles('bun.lock', 'eslint.config.mjs', 'tsconfig*.json', '.prettierrc') }}-${{ github.run_id }}
          restore-keys: |
            lumi-checks-meta-${{ runner.os }}-${{ hashFiles('bun.lock', 'eslint.config.mjs', 'tsconfig*.json', '.prettierrc') }}-
            lumi-checks-meta-${{ runner.os }}-

      - name: Install Dependencies
        run: bun install --development --ignore-scripts --no-summary

      - name: Run Type Check, Lint & Formatting in Parallel
        run: |
          set +e
          ./node_modules/.bin/tsc --noEmit -p tsconfig.node.json --composite false --incremental --tsBuildInfoFile .tsbuildinfo.node > /tmp/tsc-node.log 2>&1 &
          p1=$!
          ./node_modules/.bin/tsc --noEmit -p tsconfig.web.json --composite false --incremental --tsBuildInfoFile .tsbuildinfo.web > /tmp/tsc-web.log 2>&1 &
          p2=$!
          ./node_modules/.bin/eslint --cache . > /tmp/eslint.log 2>&1 &
          p3=$!
          ./node_modules/.bin/prettier --check --cache --cache-location .prettiercache . > /tmp/prettier.log 2>&1 &
          p4=$!

          rc=0
          wait $p1 || { echo "::group::TypeScript (node) FAILED"; cat /tmp/tsc-node.log; echo "::endgroup::"; rc=1; }
          wait $p2 || { echo "::group::TypeScript (web) FAILED"; cat /tmp/tsc-web.log; echo "::endgroup::"; rc=1; }
          wait $p3 || { echo "::group::ESLint FAILED"; cat /tmp/eslint.log; echo "::endgroup::"; rc=1; }
          wait $p4 || { echo "::group::Prettier FAILED"; cat /tmp/prettier.log; echo "::endgroup::"; rc=1; }

          if [ "$rc" -eq 0 ]; then
            cat /tmp/tsc-node.log /tmp/tsc-web.log /tmp/eslint.log /tmp/prettier.log
          fi
          exit $rc
