name: Code Quality Checks

permissions:
  contents: read

on:
  # Run on every commit to main
  push:
    branches:
      - main

  # Run on every pull request
  pull_request:
    types: [opened, synchronize, reopened]

  # Run on every manual workflow dispatch
  workflow_dispatch:

# Cancel in-progress jobs when a new push is made to the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  main-checks:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Git repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10

      - name: Install Dependencies
        run: bun install --development --ignore-scripts

      - name: Run Type Check
        run: bun run typecheck

      - name: Run Lint
        run: bun run lint

  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Git repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10

      - name: Install Dependencies
        run: bun install --development --ignore-scripts

      - name: Format Code
        run: bun run format

      - name: Verify code is formatted
        run: git diff --exit-code -- ':!bun.lock'
