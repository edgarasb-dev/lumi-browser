name: Build & Release App

permissions:
  contents: write

on:
  # Builds and releases automatically when a v* tag is pushed OR when package.json version on main has no matching tag yet
  push:
    branches:
      - main
    tags:
      - "v*"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

run-name: Release ${{ github.ref_name }}

jobs:
  create-release:
    runs-on: ubuntu-24.04
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - name: Check out Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check release status and ensure tag & GitHub Release exist
        id: check
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('package.json'))['version'])")
          TAG="v$VERSION"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
              echo "Tag $TAG already exists on origin; skipping release build."
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Tag $TAG does not exist yet on origin; creating and pushing tag for $GITHUB_SHA..."
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          fi

          CODENAME=$(python3 -c "
          import json
          v = json.load(open('package.json'))['version']
          codenames = {'0.1.0': 'Spark', '0.2.0': 'Glow', '0.3.0': 'Prism', '0.4.0': 'Flare', '0.5.0': 'Aurora', '1.0.0': 'Lumina', '2.0.0': 'Sol'}
          parts = v.split('.')
          base = f'{parts[0]}.{parts[1]}.0' if len(parts) >= 2 else v
          print(codenames.get(v) or codenames.get(base, ''))
          ")
          if [ -n "$CODENAME" ]; then
            TITLE="Lumi $TAG \"$CODENAME\""
          else
            TITLE="Lumi $TAG"
          fi
          echo "Ensuring draft release exists for $TAG with title: $TITLE..."
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --title "$TITLE" --generate-notes || true
          echo "should_release=true" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    needs: create-release
    if: needs.create-release.outputs.should_release == 'true'
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest, windows-2022]

    steps:
      - name: Optimize Windows Runner (Defender Exclusions & Same-Drive Caches)
        if: matrix.os == 'windows-2022'
        shell: pwsh
        run: |
          "BUN_INSTALL_CACHE_DIR=D:\.ci-cache\bun" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "electron_config_cache=D:\.ci-cache\electron" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ELECTRON_BUILDER_CACHE=D:\.ci-cache\electron-builder" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "PIP_CACHE_DIR=D:\.ci-cache\pip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          try {
            $paths = @(
              'D:\',
              "$env:USERPROFILE",
              "$env:TEMP",
              "$env:LOCALAPPDATA\electron",
              "$env:LOCALAPPDATA\electron-builder"
            )
            $procs = @('bun.exe', 'node.exe', 'tar.exe', 'zstd.exe', '7z.exe', '7za.exe', 'makensis.exe', 'git.exe', 'python3.exe', 'python.exe', 'pwsh.exe', 'cl.exe', 'link.exe')
            Add-MpPreference -ExclusionPath $paths -ExclusionProcess $procs
          } catch {
            Write-Host "::warning::Windows Defender exclusion skipped: $_"
          }

      - name: Check out Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use preinstalled Node.js 22+
        id: node
        shell: bash
        run: |
          shopt -s nullglob
          tc="${RUNNER_TOOL_CACHE//\\//}"
          best=""
          for dir in "$tc"/node/22.*/x64/bin "$tc"/node/22.*/arm64/bin "$tc"/node/22.*/x64; do
            if [ -x "$dir/node" ] || [ -x "$dir/node.exe" ]; then
              best="$dir"
            fi
          done
          if [ -n "$best" ]; then
            native=$(cygpath -w "$best" 2>/dev/null || printf '%s' "$best")
            echo "$native" >> "$GITHUB_PATH"
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Node.js (Fallback)
        if: steps.node.outputs.found != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10

      - name: Use Stock Electron (Ubuntu ARM only)
        if: matrix.os == 'ubuntu-24.04-arm'
        run: bun run script:use-stock-electron

      - name: Cache Electron & Builder tools (Linux)
        if: matrix.os == 'ubuntu-24.04' || matrix.os == 'ubuntu-24.04-arm'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/.local/share/gem
          key: lumi-ci-v2-linux-tools-${{ matrix.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            lumi-ci-v2-linux-tools-${{ matrix.os }}-

      - name: Cache node_modules (macOS)
        id: mac-nm-cache
        if: matrix.os == 'macos-latest'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: lumi-ci-v2-mac-nm-${{ hashFiles('bun.lock', 'package.json', 'patches/**') }}

      - name: Cache Builder & EVS tools (macOS)
        if: matrix.os == 'macos-latest'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Caches/electron-builder
            ~/Library/Caches/pip
          key: lumi-ci-v2-mac-tools-${{ hashFiles('bun.lock') }}
          restore-keys: |
            lumi-ci-v2-mac-tools-

      - name: Cache packed node_modules (Windows)
        id: win-nm-cache
        if: matrix.os == 'windows-2022'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: D:\.ci-cache\nm
          key: lumi-ci-v2-win-nm-${{ hashFiles('bun.lock', 'package.json', 'patches/**') }}

      - name: Cache Builder & EVS tools (Windows)
        if: matrix.os == 'windows-2022'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            D:\.ci-cache\electron-builder
            D:\.ci-cache\pip
          key: lumi-ci-v2-win-tools-${{ hashFiles('bun.lock') }}
          restore-keys: |
            lumi-ci-v2-win-tools-

      - name: Install Build Dependencies (Ubuntu only)
        if: matrix.os == 'ubuntu-24.04' || matrix.os == 'ubuntu-24.04-arm'
        run: |
          REQUIRED="elfutils dpkg fakeroot"
          if [ "${{ matrix.os }}" = "ubuntu-24.04-arm" ]; then
            REQUIRED="$REQUIRED ruby"
          fi
          MISSING=""
          for pkg in $REQUIRED; do
            dpkg -s "$pkg" >/dev/null 2>&1 || MISSING="$MISSING $pkg"
          done
          if [ -n "$MISSING" ]; then
            sudo apt-get update -o Acquire::Languages=none
            sudo apt-get install -y --no-install-recommends $MISSING
          fi

      - name: Install Additional Build Dependencies (Ubuntu ARM only)
        if: matrix.os == 'ubuntu-24.04-arm'
        run: |
          GEM_USER_BIN="$(ruby -e 'puts Gem.user_dir')/bin"
          if [ ! -x "$GEM_USER_BIN/fpm" ]; then
            sudo apt-get update -o Acquire::Languages=none
            sudo apt-get install -y --no-install-recommends ruby-dev
            gem install --user-install --no-document fpm -v 1.17.0
          fi
          echo "$GEM_USER_BIN" >> "$GITHUB_PATH"

      - name: Extract Cached node_modules (Windows)
        if: matrix.os == 'windows-2022' && steps.win-nm-cache.outputs.cache-hit == 'true'
        shell: pwsh
        run: |
          7z x D:\.ci-cache\nm\node_modules.7z -aoa -mmt=on -bso0 -bsp0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Dependencies
        if: |
          matrix.os == 'ubuntu-24.04' || matrix.os == 'ubuntu-24.04-arm' ||
          (matrix.os == 'macos-latest' && steps.mac-nm-cache.outputs.cache-hit != 'true') ||
          (matrix.os == 'windows-2022' && steps.win-nm-cache.outputs.cache-hit != 'true')
        shell: bash
        run: |
          bun install --development --ignore-scripts --backend=hardlink --no-summary
          if [ -f node_modules/esbuild/install.js ]; then node node_modules/esbuild/install.js; fi
          if [ "$RUNNER_OS" = "Windows" ] && [ -d node_modules/electron-winstaller ]; then
            (cd node_modules/electron-winstaller && node ./script/select-7z-arch.js)
          fi
          if [ "$RUNNER_OS" = "macOS" ] && [ -d node_modules/objc-js ]; then
            BIN="$(pwd)/node_modules/.bin/node-gyp-build"
            (cd node_modules/objc-js && "$BIN")
          fi
          bun run postinstall
        env:
          SHARP_IGNORE_GLOBAL_LIBVIPS: 1
          GYP_MSVS_VERSION: 2022

      - name: Pack node_modules Cache (Windows)
        if: matrix.os == 'windows-2022' && steps.win-nm-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path D:\.ci-cache\nm | Out-Null
          7z a -t7z -mx=1 -mmt=on -bso0 -bsp0 D:\.ci-cache\nm\node_modules.7z node_modules
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install & Login Castlabs EVS (macOS & Windows)
        if: matrix.os == 'macos-latest' || matrix.os == 'windows-2022'
        shell: bash
        run: |
          if [ -z "$ACCOUNT_NAME" ] || [ -z "$PASSWD" ]; then
            echo "CASTLABS_EVS credentials not set; skipping EVS setup."
            exit 0
          fi
          python3 -m pip install castlabs-evs==1.1.5 --break-system-packages
          python3 -m castlabs_evs.account --no-ask reauth -A "$ACCOUNT_NAME" -P "$PASSWD" || true
          python3 -m castlabs_evs.account --no-ask reauth -A "$ACCOUNT_NAME" -P "$PASSWD" || true
        env:
          ACCOUNT_NAME: ${{ secrets.CASTLABS_EVS_ACCOUNT_NAME }}
          PASSWD: ${{ secrets.CASTLABS_EVS_PASSWORD }}

      - name: Build for Linux
        if: matrix.os == 'ubuntu-24.04' || matrix.os == 'ubuntu-24.04-arm'
        run: bun run build:linux:ci -p always
        env:
          USE_SYSTEM_FPM: ${{ matrix.os == 'ubuntu-24.04-arm' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKIP_VMP: ${{ secrets.CASTLABS_EVS_ACCOUNT_NAME == '' && 'true' || 'false' }}
          EP_GH_IGNORE_TIME: "true"

      - name: Build for macOS
        if: matrix.os == 'macos-latest'
        run: bun run build:mac:ci -p always
        env:
          ELECTRON_BUILDER_COMPRESSION_LEVEL: "3"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKIP_VMP: ${{ secrets.CASTLABS_EVS_ACCOUNT_NAME == '' && 'true' || 'false' }}
          EP_GH_IGNORE_TIME: "true"
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_DATA: ${{ secrets.APPLE_API_KEY_DATA }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      - name: Build for Windows
        if: matrix.os == 'windows-2022'
        run: bun run build:win:ci -p always
        env:
          ELECTRON_BUILDER_COMPRESSION_LEVEL: "3"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKIP_VMP: ${{ secrets.CASTLABS_EVS_ACCOUNT_NAME == '' && 'true' || 'false' }}
          EP_GH_IGNORE_TIME: "true"
          GYP_MSVS_VERSION: 2022

  # Publish the draft release only once all OS builds have been uploaded
  publish-release:
    needs: [create-release, release]
    if: needs.create-release.outputs.should_release == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Publish GitHub Release
        run: |
          TAG="${{ needs.create-release.outputs.tag }}"
          gh release edit "$TAG" -R "${{ github.repository }}" --draft=false --latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
