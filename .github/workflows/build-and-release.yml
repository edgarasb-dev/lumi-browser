name: Build & Release App

permissions:
  contents: write

on:
  # Builds and releases automatically when a v* tag is pushed OR when package.json version on main has no matching tag yet
  push:
    branches:
      - main
    tags:
      - "v*"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

run-name: Release ${{ github.ref_name }}

jobs:
  create-release:
    runs-on: ubuntu-24.04
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - name: Check out Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check release status and ensure tag & GitHub Release exist
        id: check
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('package.json'))['version'])")
          TAG="v$VERSION"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
              echo "Tag $TAG already exists on origin; skipping release build."
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Tag $TAG does not exist yet on origin; creating and pushing tag for $GITHUB_SHA..."
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          fi

          CODENAME=$(python3 -c "
          import json
          v = json.load(open('package.json'))['version']
          codenames = {'0.1.0': 'Spark', '0.2.0': 'Glow', '0.3.0': 'Prism', '0.4.0': 'Flare', '0.5.0': 'Aurora', '1.0.0': 'Lumina', '2.0.0': 'Sol'}
          parts = v.split('.')
          base = f'{parts[0]}.{parts[1]}.0' if len(parts) >= 2 else v
          print(codenames.get(v) or codenames.get(base, ''))
          ")
          if [ -n "$CODENAME" ]; then
            TITLE="Lumi $TAG \"$CODENAME\""
          else
            TITLE="Lumi $TAG"
          fi
          echo "Ensuring draft release exists for $TAG with title: $TITLE..."
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --title "$TITLE" --generate-notes || true
          echo "should_release=true" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    needs: create-release
    if: needs.create-release.outputs.should_release == 'true'
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest, windows-2022]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Exclude build paths from Windows Defender
        if: matrix.os == 'windows-2022'
        continue-on-error: true
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}"
          Add-MpPreference -ExclusionPath "$env:USERPROFILE\.bun"
          Add-MpPreference -ExclusionPath "$env:LOCALAPPDATA\electron"
          Add-MpPreference -ExclusionPath "$env:LOCALAPPDATA\electron-builder"

      - name: Install Node.js, NPM and Yarn
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10

      - name: Cache Bun & Electron downloads (Linux)
        if: matrix.os == 'ubuntu-24.04' || matrix.os == 'ubuntu-24.04-arm'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.bun/install/cache
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/.local/share/gem
          key: lumi-release-${{ matrix.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            lumi-release-${{ matrix.os }}-

      - name: Cache Bun & Electron downloads (macOS)
        if: matrix.os == 'macos-latest'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.bun/install/cache
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/Library/Caches/pip
          key: lumi-release-${{ matrix.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            lumi-release-${{ matrix.os }}-

      - name: Cache Bun & Electron downloads (Windows)
        if: matrix.os == 'windows-2022'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.bun/install/cache
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
            ~/AppData/Local/pip/Cache
          key: lumi-release-${{ matrix.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            lumi-release-${{ matrix.os }}-

      - name: Use Stock Electron (Ubuntu ARM only)
        if: matrix.os == 'ubuntu-24.04-arm'
        run: bun run script:use-stock-electron

      - name: Install Build Dependencies (Ubuntu only)
        if: matrix.os == 'ubuntu-24.04' || matrix.os == 'ubuntu-24.04-arm'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends elfutils dpkg fakeroot

      - name: Install Additional Build Dependencies (Ubuntu ARM only)
        if: matrix.os == 'ubuntu-24.04-arm'
        run: |
          sudo apt-get install -y --no-install-recommends ruby
          GEM_USER_BIN="$(ruby -e 'puts Gem.user_dir')/bin"
          if [ ! -x "$GEM_USER_BIN/fpm" ]; then
            sudo apt-get install -y --no-install-recommends ruby-dev
            gem install --user-install --no-document fpm -v 1.17.0
          fi
          echo "$GEM_USER_BIN" >> "$GITHUB_PATH"

      - name: Install Dependencies
        run: bun install --development
        env:
          SHARP_IGNORE_GLOBAL_LIBVIPS: 1
          GYP_MSVS_VERSION: 2022

      - name: Install & Login Castlabs EVS (macOS & Windows)
        if: matrix.os == 'macos-latest' || matrix.os == 'windows-2022'
        shell: bash
        run: |
          if [ -z "$ACCOUNT_NAME" ] || [ -z "$PASSWD" ]; then
            echo "CASTLABS_EVS credentials not set; skipping EVS setup."
            exit 0
          fi
          python3 -m pip install castlabs-evs==1.1.5 --break-system-packages
          python3 -m castlabs_evs.account --no-ask reauth -A "$ACCOUNT_NAME" -P "$PASSWD" || true
          python3 -m castlabs_evs.account --no-ask reauth -A "$ACCOUNT_NAME" -P "$PASSWD" || true
        env:
          ACCOUNT_NAME: ${{ secrets.CASTLABS_EVS_ACCOUNT_NAME }}
          PASSWD: ${{ secrets.CASTLABS_EVS_PASSWORD }}

      - name: Build for Linux
        if: matrix.os == 'ubuntu-24.04' || matrix.os == 'ubuntu-24.04-arm'
        run: bun run build:linux:ci -p always
        env:
          USE_SYSTEM_FPM: ${{ matrix.os == 'ubuntu-24.04-arm' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKIP_VMP: ${{ secrets.CASTLABS_EVS_ACCOUNT_NAME == '' && 'true' || 'false' }}
          EP_GH_IGNORE_TIME: "true"

      - name: Build for macOS
        if: matrix.os == 'macos-latest'
        run: bun run build:mac:ci -p always
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKIP_VMP: ${{ secrets.CASTLABS_EVS_ACCOUNT_NAME == '' && 'true' || 'false' }}
          EP_GH_IGNORE_TIME: "true"
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_DATA: ${{ secrets.APPLE_API_KEY_DATA }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      - name: Build for Windows
        if: matrix.os == 'windows-2022'
        run: bun run build:win:ci -p always
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKIP_VMP: ${{ secrets.CASTLABS_EVS_ACCOUNT_NAME == '' && 'true' || 'false' }}
          EP_GH_IGNORE_TIME: "true"
          GYP_MSVS_VERSION: 2022

  # Publish the draft release only once all OS builds have been uploaded
  publish-release:
    needs: [create-release, release]
    if: needs.create-release.outputs.should_release == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Publish GitHub Release
        run: |
          TAG="${{ needs.create-release.outputs.tag }}"
          gh release edit "$TAG" -R "${{ github.repository }}" --draft=false --latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
