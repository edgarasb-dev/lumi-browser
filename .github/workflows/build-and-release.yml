name: Build & Release App

permissions:
  contents: write

on:
  # Builds and releases automatically when a v* tag is pushed OR when package.json version on main has no matching tag yet
  push:
    branches:
      - main
    tags:
      - "v*"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

run-name: Release ${{ github.ref_name }}

jobs:
  create-release:
    runs-on: ubuntu-24.04
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - name: Check out Git repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Check release status and ensure tag & GitHub Release exist
        id: check
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('package.json'))['version'])")
          TAG="v$VERSION"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
              echo "Tag $TAG already exists on origin; skipping release build."
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Tag $TAG does not exist yet on origin; creating and pushing tag for $GITHUB_SHA..."
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          fi

          CODENAME=$(python3 -c "
          import json
          v = json.load(open('package.json'))['version']
          codenames = {'0.1.0': 'Spark', '0.2.0': 'Glow', '0.3.0': 'Prism', '0.4.0': 'Flare', '0.5.0': 'Aurora', '1.0.0': 'Lumina', '2.0.0': 'Sol'}
          parts = v.split('.')
          base = f'{parts[0]}.{parts[1]}.0' if len(parts) >= 2 else v
          print(codenames.get(v) or codenames.get(base, ''))
          ")
          if [ -n "$CODENAME" ]; then
            TITLE="Lumi $TAG \"$CODENAME\""
          else
            TITLE="Lumi $TAG"
          fi
          echo "Ensuring release exists for $TAG with title: $TITLE..."
          gh release view "$TAG" || gh release create "$TAG" --title "$TITLE" --generate-notes || true
          echo "should_release=true" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    needs: create-release
    if: needs.create-release.outputs.should_release == 'true'
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-2022]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Install Node.js, NPM and Yarn
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10

      - name: Use Stock Electron (Ubuntu ARM only)
        if: matrix.os == 'ubuntu-24.04-arm'
        run: bun run script:use-stock-electron

      - name: Install Build Dependencies (Ubuntu only)
        if: matrix.os == 'ubuntu-24.04' || matrix.os == 'ubuntu-24.04-arm'
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak-builder elfutils dpkg fakeroot

      - name: Install Additional Build Dependencies (Ubuntu ARM only)
        if: matrix.os == 'ubuntu-24.04-arm'
        run: |
          sudo apt-get install -y ruby ruby-dev
          sudo gem install --no-document fpm -v 1.17.0

      - name: Setup Flatpak (Ubuntu only)
        if: matrix.os == 'ubuntu-24.04' || matrix.os == 'ubuntu-24.04-arm'
        run: |
          flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Install Dependencies
        run: bun install --development
        env:
          SHARP_IGNORE_GLOBAL_LIBVIPS: 1
          GYP_MSVS_VERSION: 2022

      - name: Install Castlabs EVS
        if: matrix.os == 'macos-latest' || matrix.os == 'macos-15-intel' || matrix.os == 'windows-2022'
        run: python3 -m pip install castlabs-evs==1.1.5 --break-system-packages

      - name: Login to Castlabs EVS (macOS)
        if: (matrix.os == 'macos-latest' || matrix.os == 'macos-15-intel') && env.ACCOUNT_NAME != '' && env.PASSWD != ''
        continue-on-error: true
        run: python3 -m castlabs_evs.account --no-ask reauth -A "$ACCOUNT_NAME" -P "$PASSWD"
        env:
          ACCOUNT_NAME: ${{ secrets.CASTLABS_EVS_ACCOUNT_NAME }}
          PASSWD: ${{ secrets.CASTLABS_EVS_PASSWORD }}

      - name: Login to Castlabs EVS (Windows)
        if: matrix.os == 'windows-2022' && env.ACCOUNT_NAME != '' && env.PASSWD != ''
        continue-on-error: true
        shell: cmd
        run: python3 -m castlabs_evs.account --no-ask reauth -A "%ACCOUNT_NAME%" -P "%PASSWD%"
        env:
          ACCOUNT_NAME: ${{ secrets.CASTLABS_EVS_ACCOUNT_NAME }}
          PASSWD: ${{ secrets.CASTLABS_EVS_PASSWORD }}

      - name: Build for Linux
        if: matrix.os == 'ubuntu-24.04' || matrix.os == 'ubuntu-24.04-arm'
        run: bun run build:linux -p always
        env:
          USE_SYSTEM_FPM: ${{ matrix.os == 'ubuntu-24.04-arm' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKIP_VMP: ${{ secrets.CASTLABS_EVS_ACCOUNT_NAME == '' && 'true' || 'false' }}
          EP_GH_IGNORE_TIME: "true"

      - name: Build for macOS
        if: matrix.os == 'macos-latest' || matrix.os == 'macos-15-intel'
        run: bun run build:mac -p never
        env:
          SKIP_VMP: ${{ secrets.CASTLABS_EVS_ACCOUNT_NAME == '' && 'true' || 'false' }}
          EP_GH_IGNORE_TIME: "true"
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_DATA: ${{ secrets.APPLE_API_KEY_DATA }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      - name: Build for Windows
        if: matrix.os == 'windows-2022'
        run: bun run build:win -p always
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKIP_VMP: ${{ secrets.CASTLABS_EVS_ACCOUNT_NAME == '' && 'true' || 'false' }}
          EP_GH_IGNORE_TIME: "true"
          GYP_MSVS_VERSION: 2022

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ matrix.os }}
          retention-days: 1
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/*.yml
            dist/*.blockmap
            dist/*.flatpak

  # Merge latest-mac.yml across arm64 + x64 before uploading so neither overwrites the other
  publish-macos:
    needs: [create-release, release]
    if: needs.create-release.outputs.should_release == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out Git repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10

      - name: Download macOS arm64 artifacts
        continue-on-error: true
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: macos-latest
          path: mac-arm64

      - name: Download macOS x64 artifacts
        continue-on-error: true
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: macos-15-intel
          path: mac-x64

      - name: Merge latest-mac.yml and stage assets
        run: |
          bun -e '
          import fs from "node:fs";
          import path from "node:path";

          type MacManifestFile = { url: string; sha512?: string; size?: number; blockMapSize?: number };
          type MacManifest = { version?: string; files?: MacManifestFile[]; path?: string; sha512?: string; releaseDate?: string };

          const outDir = "mac-publish";
          fs.mkdirSync(outDir, { recursive: true });

          const dirs = ["mac-arm64", "mac-x64"].filter((dir) => fs.existsSync(dir));
          if (dirs.length === 0) {
            console.error("No macOS build artifacts were downloaded.");
            process.exit(1);
          }

          const manifests: MacManifest[] = [];
          for (const dir of dirs) {
            for (const entry of fs.readdirSync(dir)) {
              const srcPath = path.join(dir, entry);
              if (entry === "latest-mac.yml") {
                manifests.push(Bun.YAML.parse(fs.readFileSync(srcPath, "utf8")) as MacManifest);
              } else if (fs.statSync(srcPath).isFile()) {
                fs.copyFileSync(srcPath, path.join(outDir, entry));
              }
            }
          }

          if (manifests.length === 0) {
            console.error("No latest-mac.yml manifests found.");
            process.exit(1);
          }

          const seen = new Set<string>();
          const mergedFiles: MacManifestFile[] = [];
          for (const manifest of manifests) {
            for (const file of manifest.files ?? []) {
              if (!seen.has(file.url)) {
                seen.add(file.url);
                mergedFiles.push(file);
              }
            }
          }

          const primary = manifests[0];
          const lines = [`version: ${primary.version}`, "files:"];
          for (const file of mergedFiles) {
            lines.push(`  - url: ${file.url}`);
            if (file.sha512) lines.push(`    sha512: ${file.sha512}`);
            if (file.size != null) lines.push(`    size: ${file.size}`);
            if (file.blockMapSize != null) lines.push(`    blockMapSize: ${file.blockMapSize}`);
          }
          if (primary.path) lines.push(`path: ${primary.path}`);
          if (primary.sha512) lines.push(`sha512: ${primary.sha512}`);
          if (primary.releaseDate) lines.push(`releaseDate: '\''${primary.releaseDate}'\''`);

          fs.writeFileSync(path.join(outDir, "latest-mac.yml"), lines.join("\n") + "\n");
          '

      - name: Upload macOS assets and merged latest-mac.yml
        run: |
          TAG="${{ needs.create-release.outputs.tag }}"
          gh release upload "$TAG" mac-publish/* --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
