name: Build App

permissions: {}

on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      include_flatpak:
        description: "Also run the heavy Flatpak build jobs"
        required: false
        type: boolean
        default: false

  # Run on every push to a pull request (skip docs-only PRs)
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - "**.md"
      - "docs/**"

# Cancel in-progress jobs when a new push is made to the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Runs before the build starts
  # Cannot find a way to do this yet without compromising security
  before-build-comment:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Comment PR with build status
        continue-on-error: true
        uses: thollander/actions-comment-pull-request@24bffb9b452ba05a4f3f77933840a6a841d1b32b # v3.0.1
        with:
          message: |
            ### Build is in progress... 🚀
            Currently building for this pull request!
          comment-tag: build

  # Check whether PR touched packaging/deps files that affect Flatpak
  flatpak-filter:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    outputs:
      should_run: ${{ steps.filter.outputs.should_run }}
    steps:
      - name: Check if Flatpak inputs changed
        id: filter
        run: |
          if gh api --paginate "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --jq '.[].filename' | grep -qE '^(package\.json|bun\.lock|electron-builder\.ts|electron\.vite\.config\.ts|build/|scripts/|patches/|\.github/workflows/build\.yml|.*\.metainfo\.xml)'; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  # Flatpak using manifest + generated-sources from Flathub (cloned each run to stay in sync)
  build-flatpak:
    needs: [flatpak-filter]
    if: ${{ !cancelled() && ((github.event_name == 'workflow_dispatch' && inputs.include_flatpak) || (github.event_name == 'pull_request' && needs.flatpak-filter.outputs.should_run == 'true')) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            flatpak_arch: x86_64
          - os: ubuntu-24.04-arm
            flatpak_arch: aarch64

    steps:
      - name: Check out Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Clone Flathub packaging (com.flow_browser.flow)
        run: git clone --depth 1 -b master https://github.com/flathub/com.flow_browser.flow.git flatpak-upstream

      - name: Stage app sources for Flatpak build
        run: |
          mkdir -p flatpak-upstream/main
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='node_modules/' \
            --exclude='dist/' \
            --exclude='out/' \
            --exclude='flatpak-upstream/' \
            ./ flatpak-upstream/main/

      - name: Set Flatpak metainfo version (package version + short SHA)
        run: |
          python3 <<'PY'
          import json
          import os
          import re
          from datetime import datetime, timezone
          from pathlib import Path

          sha = os.environ["GITHUB_SHA"]
          short = sha[:7]
          root = Path("flatpak-upstream/main")

          pkg = json.loads((root / "package.json").read_text())
          base = str(pkg["version"]).split("+", 1)[0]
          version = f"{base}+{short}"

          meta_path = root / "com.flow_browser.flow.metainfo.xml"
          text = meta_path.read_text()
          today = datetime.now(timezone.utc).strftime("%Y-%m-%d")
          text, n = re.subn(
              r'(<release version=")[^"]+(" date=")[^"]+(")',
              rf"\g<1>{version}\g<2>{today}\g<3>",
              text,
              count=1,
          )
          if n != 1:
              raise SystemExit(
                  "Expected exactly one <release> in com.flow_browser.flow.metainfo.xml; "
                  "update the regex in build.yml if the file changed."
              )
          meta_path.write_text(text)
          PY

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10

      - name: Cache Flatpak runtime
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/flatpak
          key: lumi-flatpak-runtime-${{ matrix.flatpak_arch }}-${{ hashFiles('.github/workflows/build.yml') }}
          restore-keys: |
            lumi-flatpak-runtime-${{ matrix.flatpak_arch }}-

      - name: Cache Flatpak builder state
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: flatpak-upstream/.flatpak-builder
          key: lumi-flatpak-builder-${{ matrix.flatpak_arch }}-${{ hashFiles('bun.lock', 'package.json', '.github/workflows/build.yml') }}
          restore-keys: |
            lumi-flatpak-builder-${{ matrix.flatpak_arch }}-

      - name: Generate Flatpak sources from local bun.lock
        working-directory: flatpak-upstream
        run: |
          rm -f ./generated-sources.json
          bun add -g flatpak-bun-generator@latest
          SCRIPT_PATH="$(readlink -f "$(bun pm bin -g)/flatpak-bun-generator")"
          node "$SCRIPT_PATH" ./main/bun.lock --output ./generated-sources.json

      - name: Patch Flathub manifest to build from this checkout
        run: |
          python3 <<'PY'
          import re
          from pathlib import Path

          path = Path("flatpak-upstream/com.flow_browser.flow.yml")
          text = path.read_text()
          pattern = r"      - type: archive\n(?:(?!      - generated-sources).)+\n          is-main-source: true\n"
          replacement = (
              "      - type: dir\n"
              "        path: main\n"
              "        dest: main\n"
          )
          new_text, n = re.subn(pattern, replacement, text, count=1, flags=re.DOTALL)
          if n != 1:
              raise SystemExit(
                  "Expected to replace exactly one Flathub main source archive block; "
                  "update the regex in build.yml if com.flow_browser.flow.yml changed."
              )
          path.write_text(new_text)
          PY

      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder

      - name: Setup Flathub remote
        run: flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      # Single online build: a second phase with --disable-download runs the sandbox without
      # outbound network, but bun still resolves optional/native deps (e.g. rolldown/lightningcss
      # bindings) that flatpak-bun-generator may not fully vendor — bun install then fails.
      - name: Build Flatpak
        working-directory: flatpak-upstream
        run: |
          flatpak-builder --user --install-deps-from=flathub --repo="${{ github.workspace }}/flatpak-repo" \
            --force-clean build-dir com.flow_browser.flow.yml

      - name: Create Flatpak bundle
        run: |
          mkdir -p dist-flatpak
          flatpak build-bundle --arch=${{ matrix.flatpak_arch }} \
            "${{ github.workspace }}/flatpak-repo" \
            "dist-flatpak/com.flow_browser.flow.${{ matrix.flatpak_arch }}.flatpak" \
            com.flow_browser.flow

      - name: Upload Flatpak bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flatpak-${{ matrix.os }}
          retention-days: 1
          path: dist-flatpak/*.flatpak

  # Runs the build
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-2022]

    steps:
      - name: Optimize Windows Runner (Defender Exclusions & Same-Drive Caches)
        if: matrix.os == 'windows-2022'
        shell: pwsh
        run: |
          "BUN_INSTALL_CACHE_DIR=D:\.ci-cache\bun" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "electron_config_cache=D:\.ci-cache\electron" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ELECTRON_BUILDER_CACHE=D:\.ci-cache\electron-builder" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          try {
            $paths = @(
              'D:\',
              "$env:USERPROFILE",
              "$env:TEMP",
              "$env:LOCALAPPDATA\electron",
              "$env:LOCALAPPDATA\electron-builder"
            )
            $procs = @('bun.exe', 'node.exe', 'tar.exe', 'zstd.exe', '7z.exe', '7za.exe', 'makensis.exe', 'git.exe', 'python3.exe', 'python.exe', 'pwsh.exe', 'cl.exe', 'link.exe')
            Add-MpPreference -ExclusionPath $paths -ExclusionProcess $procs
          } catch {
            Write-Host "::warning::Windows Defender exclusion skipped: $_"
          }

      - name: Check out Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use preinstalled Node.js 22+
        id: node
        shell: bash
        run: |
          shopt -s nullglob
          tc="${RUNNER_TOOL_CACHE//\\//}"
          best=""
          for dir in "$tc"/node/22.*/x64/bin "$tc"/node/22.*/arm64/bin "$tc"/node/22.*/x64; do
            if [ -x "$dir/node" ] || [ -x "$dir/node.exe" ]; then
              best="$dir"
            fi
          done
          if [ -n "$best" ]; then
            native=$(cygpath -w "$best" 2>/dev/null || printf '%s' "$best")
            echo "$native" >> "$GITHUB_PATH"
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Node.js (Fallback)
        if: steps.node.outputs.found != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.10

      - name: Use Stock Electron (Ubuntu ARM only)
        if: matrix.os == 'ubuntu-24.04-arm'
        run: bun run script:use-stock-electron

      - name: Cache Electron & Builder tools (Linux)
        if: matrix.os == 'ubuntu-latest' || matrix.os == 'ubuntu-24.04-arm'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/.local/share/gem
          key: lumi-ci-v2-linux-tools-${{ matrix.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            lumi-ci-v2-linux-tools-${{ matrix.os }}-

      - name: Cache node_modules (macOS)
        id: mac-nm-cache
        if: matrix.os == 'macos-latest'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: lumi-ci-v2-mac-nm-${{ hashFiles('bun.lock', 'package.json', 'patches/**') }}

      - name: Cache Builder tools (macOS)
        if: matrix.os == 'macos-latest'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/electron-builder
          key: lumi-ci-v2-mac-tools-${{ hashFiles('bun.lock') }}
          restore-keys: |
            lumi-ci-v2-mac-tools-

      - name: Cache packed node_modules (Windows)
        id: win-nm-cache
        if: matrix.os == 'windows-2022'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: D:\.ci-cache\nm
          key: lumi-ci-v2-win-nm-${{ hashFiles('bun.lock', 'package.json', 'patches/**') }}

      - name: Cache Builder tools (Windows)
        if: matrix.os == 'windows-2022'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: D:\.ci-cache\electron-builder
          key: lumi-ci-v2-win-tools-${{ hashFiles('bun.lock') }}
          restore-keys: |
            lumi-ci-v2-win-tools-

      - name: Install Build Dependencies (Ubuntu only)
        if: matrix.os == 'ubuntu-latest' || matrix.os == 'ubuntu-24.04-arm'
        run: |
          REQUIRED="elfutils dpkg fakeroot"
          if [ "${{ matrix.os }}" = "ubuntu-24.04-arm" ]; then
            REQUIRED="$REQUIRED ruby"
          fi
          MISSING=""
          for pkg in $REQUIRED; do
            dpkg -s "$pkg" >/dev/null 2>&1 || MISSING="$MISSING $pkg"
          done
          if [ -n "$MISSING" ]; then
            sudo apt-get update -o Acquire::Languages=none
            sudo apt-get install -y --no-install-recommends $MISSING
          fi

      - name: Install Additional Build Dependencies (Ubuntu ARM only)
        if: matrix.os == 'ubuntu-24.04-arm'
        run: |
          GEM_USER_BIN="$(ruby -e 'puts Gem.user_dir')/bin"
          if [ ! -x "$GEM_USER_BIN/fpm" ]; then
            sudo apt-get update -o Acquire::Languages=none
            sudo apt-get install -y --no-install-recommends ruby-dev
            gem install --user-install --no-document fpm -v 1.17.0
          fi
          echo "$GEM_USER_BIN" >> "$GITHUB_PATH"

      - name: Extract Cached node_modules (Windows)
        if: matrix.os == 'windows-2022' && steps.win-nm-cache.outputs.cache-hit == 'true'
        shell: pwsh
        run: |
          7z x D:\.ci-cache\nm\node_modules.7z -aoa -mmt=on -bso0 -bsp0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Dependencies
        if: |
          matrix.os == 'ubuntu-latest' || matrix.os == 'ubuntu-24.04-arm' ||
          (matrix.os == 'macos-latest' && steps.mac-nm-cache.outputs.cache-hit != 'true') ||
          (matrix.os == 'windows-2022' && steps.win-nm-cache.outputs.cache-hit != 'true')
        shell: bash
        run: |
          bun install --development --ignore-scripts --backend=hardlink --no-summary
          if [ -f node_modules/esbuild/install.js ]; then node node_modules/esbuild/install.js; fi
          if [ "$RUNNER_OS" = "Windows" ] && [ -d node_modules/electron-winstaller ]; then
            (cd node_modules/electron-winstaller && node ./script/select-7z-arch.js)
          fi
          if [ "$RUNNER_OS" = "macOS" ] && [ -d node_modules/objc-js ]; then
            BIN="$(pwd)/node_modules/.bin/node-gyp-build"
            (cd node_modules/objc-js && "$BIN")
          fi
          bun run postinstall
        env:
          SHARP_IGNORE_GLOBAL_LIBVIPS: 1
          GYP_MSVS_VERSION: 2022

      - name: Pack node_modules Cache (Windows)
        if: matrix.os == 'windows-2022' && steps.win-nm-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path D:\.ci-cache\nm | Out-Null
          7z a -t7z -mx=1 -mmt=on -bso0 -bsp0 D:\.ci-cache\nm\node_modules.7z node_modules
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build for Linux
        if: matrix.os == 'ubuntu-latest' || matrix.os == 'ubuntu-24.04-arm'
        run: bun run build:linux:ci -p never
        env:
          USE_SYSTEM_FPM: ${{ matrix.os == 'ubuntu-24.04-arm' }}

      - name: Build for macOS
        if: matrix.os == 'macos-latest'
        run: bun run build:mac:ci -p never
        env:
          ELECTRON_BUILDER_COMPRESSION_LEVEL: "1"

      - name: Build for Windows
        if: matrix.os == 'windows-2022'
        run: bun run build:win:ci -p never
        env:
          ELECTRON_BUILDER_COMPRESSION_LEVEL: "1"
          GYP_MSVS_VERSION: 2022

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.os }}
          retention-days: 1
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/*.yml
            dist/*.blockmap
            dist/*.flatpak

  # Runs after all builds complete
  after-build-comment:
    needs: [build, build-flatpak]
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.build-flatpak.result == 'success' || needs.build-flatpak.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    env:
      BUILD_ARTIFACTS_MESSAGE: |
        ### Build artifacts for all platforms are ready! 🚀
        Download the artifacts for:
        - [Linux](https://nightly.link/${{ github.repository }}/actions/runs/${{ github.run_id }}/ubuntu-latest.zip)
        - [Linux (arm64)](https://nightly.link/${{ github.repository }}/actions/runs/${{ github.run_id }}/ubuntu-24.04-arm.zip)
        - [macOS (Apple Silicon)](https://nightly.link/${{ github.repository }}/actions/runs/${{ github.run_id }}/macos-latest.zip)
        - [Windows](https://nightly.link/${{ github.repository }}/actions/runs/${{ github.run_id }}/windows-latest.zip)
        - [Flatpak (x64)](https://nightly.link/${{ github.repository }}/actions/runs/${{ github.run_id }}/flatpak-ubuntu-latest.zip)
        - [Flatpak (arm64)](https://nightly.link/${{ github.repository }}/actions/runs/${{ github.run_id }}/flatpak-ubuntu-24.04-arm.zip)

        <details>
        <summary>One-line installer (Unstable):</summary>

        ```bash
        bunx flow-debug-build@1.2.1 --open ${{ github.run_id }}
        ```

        </details>

        _(execution **${{ github.run_id }}** / attempt **${{ github.run_attempt }}**)_
    steps:
      - name: Add workflow summary
        run: printf '%s\n' "$BUILD_ARTIFACTS_MESSAGE" >> "$GITHUB_STEP_SUMMARY"
      - name: Comment PR with artifact links
        if: github.event_name == 'pull_request'
        uses: thollander/actions-comment-pull-request@24bffb9b452ba05a4f3f77933840a6a841d1b32b # v3.0.1
        continue-on-error: true
        with:
          message: ${{ env.BUILD_ARTIFACTS_MESSAGE }}
          comment-tag: build
